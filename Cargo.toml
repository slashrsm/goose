[package]
name = "goose"
version = "0.19.0-dev"
authors = ["Jeremy Andrews <jeremy@tag1consulting.com>"]
edition = "2018"
description = "A load testing framework inspired by Locust."
homepage = "https://tag1.com/goose"
documentation = "https://book.goose.rs"
repository = "https://github.com/tag1consulting/goose"
readme = "README.md"
keywords = ["loadtesting", "performance", "web", "framework", "tool"]
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "query",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ctrlc = "3"
downcast-rs = "2.0"
flume = "0.12"
futures = "0.3"
gumdrop = "0.8"
http = "1.1"
itertools = "0.14"
lazy_static = "1.4"
log = "0.4"
num-format = "0.4"
rand = "0.9"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "default-tls",
    "form",
    "gzip",
    "json",
] }
serde = { version = "1.0", features = [
    "derive",
] }
serde_json = "1.0"
simplelog = "0.12"
strum = "0.27"
strum_macros = "0.27"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "time",
    "sync",
] }
tokio-stream = "0.1"
tokio-tungstenite = "0.28"
tower-http = { version = "0.6", features = ["set-header"] }
url = "2"
headless_chrome = { version = "1.0", features = ["fetch"], optional = true }
urlencoding = { version = "2.1", optional = true }

[features]
# Include cookies by default for backward compatibility and expected behavior in web load testing.
# Default dashboard UI is vanilla JS + ECharts (no extra WASM toolchain for consumers).
default = ["cookies", "dashboard-js"]
# reqwest >==0.13 already defaults to rustls
rustls-tls = ["tokio-tungstenite/rustls"]
# Cookie support - can be completely disabled by compiling with --no-default-features for maximum performance
cookies = ["reqwest/cookies"]
pdf-reports = ["headless_chrome", "urlencoding"]
# Live web dashboard frontends (compile-time).
#   dashboard-js   — vanilla JS + ECharts (default; nicest charts, CDN for ECharts)
#   dashboard-wasm — Yew WebAssembly UI (rebuild with scripts/build-dashboard-ui.sh)
#   dashboard-elm  — Elm 0.19 UI (rebuild with scripts/build-dashboard-elm.sh)
# Precedence if several are enabled: wasm > elm > js
dashboard-js = []
dashboard-wasm = []
dashboard-elm = []

[dev-dependencies]
httpmock = "0.8"
nix = { version = "0.30", features = ["signal"] }
rustls = "0.23"
serial_test = "3.2"
