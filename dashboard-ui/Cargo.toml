[package]
name = "goose-dashboard-ui"
version = "0.1.0"
edition = "2021"
description = "WebAssembly frontend for the Goose live load-test dashboard"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "EventSource",
    "EventTarget",
    "HtmlElement",
    "MessageEvent",
    "Window",
] }
yew = { version = "0.21", features = ["csr"] }

[profile.release]
opt-level = "s"
lto = true
